<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Laboratório Virtual Interativo — simulações de física com Monitor de IA.">
    <title>Virtual Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/simulacao.css">
    <link rel="stylesheet" href="css/componentes.css">
    <link rel="stylesheet" href="css/avatar.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- Topbar -->
    <header class="topbar">
        <div class="topbar-left">
            <span class="topbar-brand">Laboratório Virtual Interativo</span>
        </div>
        <div class="topbar-right">
            <div class="topbar-search">
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="M10.5 10.5L14 14"/></svg>
                <input type="text" placeholder="Buscar experimentos..." id="topbar-search-input">
            </div>
            <div class="topbar-icon" title="Galeria"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="14" height="10" rx="1.5"/><circle cx="5.5" cy="7" r="1.5"/><path d="M1 11l4-3 3 2.5 2-1.5 5 4"/></svg></div>
            <div class="topbar-icon" title="Notificações"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 1a5 5 0 0 1 5 5v3l1.5 2h-13L3 9V6a5 5 0 0 1 5-5z"/><path d="M6.5 13.5a1.5 1.5 0 0 0 3 0"/></svg></div>
            <div class="topbar-icon" title="Configurações"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1"/></svg></div>
            <div class="topbar-avatar" title="Perfil">U</div>
        </div>
    </header>

    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-section-label">Simulações</div>
                <nav id="sidebar-nav"><!-- construído por app.js --></nav>
            </div>
            <div class="sidebar-footer">
                <button class="btn-lab" id="btn-iniciar-lab">
                    <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2.5l10 5.5-10 5.5V2.5z"/></svg>
                    Iniciar Lab Virtual
                </button>
                <div class="sidebar-link">
                    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="2" y="2" width="12" height="12" rx="1"/><path d="M5 6h6M5 9h4"/></svg>
                    Documentação
                </div>
                <div class="sidebar-link">
                    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 2"/></svg>
                    Status do Sistema
                </div>
            </div>
        </aside>

        <!-- App Body -->
        <div class="app-body">
            <div class="content-area">

                <!-- Page Header -->
                <div class="page-header">
                    <div>
                        <div class="page-breadcrumb" id="page-breadcrumb">Experimento de Física</div>
                        <h1 class="page-title" id="page-title">Carregando…</h1>
                    </div>
                    <div class="page-actions">
                        <button class="btn btn-ghost" id="btn-reiniciar">
                            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 8a6.5 6.5 0 1 0 1.2-3.8"/><path d="M1.5 2.5V5h2.5"/></svg>
                            Reiniciar
                        </button>
                        <button class="btn btn-primary" id="btn-iniciar-sim">
                            <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2.5l10 5.5-10 5.5V2.5z"/></svg>
                            Iniciar Simulação
                        </button>
                    </div>
                </div>

                <!-- Main Grid -->
                <div class="main-grid">

                    <!-- Coluna esquerda: palco + gráfico -->
                    <div class="left-col">

                        <!-- Palco animado -->
                        <div class="card sim-stage" id="card-simulacao">
                            <canvas id="canvasSim"></canvas>
                            <div class="sim-controls">
                                <button class="sim-btn" id="btn-play" title="Pausar/Continuar">
                                    <svg id="icon-pause" width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>
                                    <svg id="icon-play"  width="12" height="12" viewBox="0 0 16 16" fill="currentColor" style="display:none"><path d="M4 2l10 6-10 6z"/></svg>
                                </button>
                                <span class="sim-time" id="sim-tempo">t = 0.00 s</span>
                            </div>
                        </div>

                        <!-- Gráfico -->
                        <div class="card chart-card" id="card-grafico">
                            <div class="chart-header">
                                <div class="chart-title">
                                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 13 L5 7 L9 10 L13 4 L15 6"/></svg>
                                    <span class="chart-title-text">Gráfico</span>
                                </div>
                                <div class="chart-legend"><!-- preenchido por Grafico --></div>
                            </div>
                            <div class="chart-body">
                                <canvas id="graficoMola"></canvas>
                                <div class="chart-empty" id="chart-vazio">
                                    <svg viewBox="0 0 400 60" preserveAspectRatio="none" class="chart-empty-wave">
                                        <path d="M0 30 Q25 0 50 30 T100 30 T150 30 T200 30 T250 30 T300 30 T350 30 T400 30"/>
                                    </svg>
                                    <div class="chart-empty-text">
                                        <strong>Nenhum dado ainda</strong>
                                        <span>Ajuste os parâmetros e clique em <em>Iniciar Simulação</em> para gerar o gráfico.</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div><!-- /left-col -->

                    <!-- Painel Direito -->
                    <div class="right-panel">

                        <!-- Parâmetros (renderizado dinamicamente por app.js) -->
                        <div class="card" id="card-parametros">
                            <div class="card-header">
                                <div class="card-title">
                                    <span class="card-title-icon">
                                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 4h10M3 8h10M3 12h6"/></svg>
                                    </span>
                                    Parâmetros Físicos
                                </div>
                            </div>
                            <div class="card-body">
                                <div class="params-list" id="params-list"><!-- preenchido por app.js --></div>
                            </div>
                        </div>

                        <!-- Insights / Chat IA -->
                        <div class="card" id="card-insights">
                            <div class="card-header">
                                <div class="card-title">
                                    <span class="card-title-icon">
                                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5" r="3"/><path d="M8 8v5M6 11h4"/></svg>
                                    </span>
                                    Insights da IA
                                </div>
                                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.35"><path d="M8 1l1.5 3 3.5.5-2.5 2.5.5 3.5L8 9l-3 1.5.5-3.5L3 4.5l3.5-.5L8 1z"/></svg>
                            </div>
                            <div class="card-body">
                                <div class="chat-body" id="chatHistorico"></div>
                                <div class="insight-tip" id="insight-dica"></div>
                                <div class="chat-input-row">
                                    <input class="chat-input" type="text" id="perguntaInput" placeholder="Perguntar ao Monitor Virtual...">
                                    <button class="chat-send" id="btn-enviar-chat" title="Enviar">
                                        <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M2 8l12-6-5 6 5 6-12-6z"/></svg>
                                    </button>
                                </div>
                            </div>
                        </div>

                    </div><!-- /right-panel -->

                </div><!-- /main-grid -->
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
