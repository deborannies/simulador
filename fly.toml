# Configuração do Fly.io para o Laboratório Virtual
# O build usa o Dockerfile da raiz do projeto.

app = 'virtual-lab-utfpr'
primary_region = 'gru'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
